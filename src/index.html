<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060d">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Ballast">
<title>Ballast</title>
<link rel="icon" href="assets/ballast.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">
<link rel="stylesheet" href="css/crisis.css">
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<div class="nebula" aria-hidden="true"></div>

<header class="topbar">
  <div class="brand"><span class="brand-dot"></span>Ballast</div>
  <nav class="tabs" id="tabs">
    <button data-tab="today" class="active">Today</button>
    <button data-tab="drawer">Drawer</button>
    <button data-tab="chain">Chain</button>
    <button data-tab="people">People</button>
    <button data-tab="coach">Coach</button>
    <button data-tab="suspicion">Suspicion</button>
    <button data-tab="review">Review</button>
    <button data-tab="settings">Settings</button>
  </nav>
  <button id="crisis-btn" class="crisis-btn" title="Guided steps for right now">I need help now</button>
</header>

<main id="view" class="view"></main>

<div id="crisis" class="crisis hidden" role="dialog" aria-modal="true"></div>
<div id="toast" class="toast hidden"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
