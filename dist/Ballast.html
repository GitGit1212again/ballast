<style>
/* ---- css/base.css ---- */
:root {
  --bg: #07060d;
  --bg-2: #0e0b1a;
  --panel: rgba(20, 14, 38, 0.72);
  --panel-2: rgba(30, 20, 56, 0.6);
  --line: rgba(190, 150, 255, 0.16);
  --text: #ece6fb;
  --muted: #9d93bf;
  --purple: #9b5cff;
  --purple-2: #6f3bd6;
  --teal: #2fe0d0;
  --teal-2: #17a89c;
  --pink: #ff5fb8;
  --pink-2: #d63c8f;
  --danger: #ff5f7e;
  --ok: #4ee2a0;
  --radius: 14px;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.45);
  --font: "Segoe UI", system-ui, -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
button, .btn, .chip, label { touch-action: manipulation; }
/* iOS Safari zooms the page when a focused field is under 16px */
@media (pointer: coarse) { input, select, textarea { font-size: max(16px, 1em); } }
body {
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  line-height: 1.45;
  overflow-x: hidden;
}
h1, h2, h3, h4 { margin: 0 0 .5rem; font-weight: 600; letter-spacing: .01em; }
h2 { font-size: 1.25rem; }
h3 { color: var(--muted); text-transform: uppercase; letter-spacing: .08em; font-size: .78rem; }
p { margin: .3rem 0 .8rem; }
a { color: var(--teal); }

      if (i >= 0) d.skills.splice(i, 1); else d.skills.push(name);
      openSkills = true;
      save(); rerender(); return;
    }
    const hist = e.target.closest("[data-day]");
    if (hist) { current = hist.dataset.day; rerender(); return; }
    if (e.target.closest("[data-sleep-add]")) { d.sleep.push({ start: "", end: "", hours: "" }); save(); rerender(); return; }
    const rm = e.target.closest("[data-sleep-rm]");
    if (rm) { d.sleep.splice(Number(rm.dataset.sleepRm), 1); sleepSummary(d); save(); rerender(); return; }
  }

  /* Sleep as a list of stretches, because one number hides broken sleep. Each stretch is a
     clock start/end (crossing midnight is fine) or, when the times are a blur, just hours. */
  function sleepHtml(d) {
    const sum = sleepSummary(d);
    const rows = d.sleep.map((ep, i) => {
      const h = sleepHours(ep);
      return `
        <div class="sleeprow">
          <input type="time" data-sleep="${i}" data-sf="start" value="${esc(ep.start || "")}" title="fell asleep">
          <span class="muted">to</span>
          <input type="time" data-sleep="${i}" data-sf="end" value="${esc(ep.end || "")}" title="woke">
          <span class="muted small">or</span>
          <input type="number" min="0" max="24" step="0.25" style="width:70px" data-sleep="${i}" data-sf="hours" value="${esc(ep.start && ep.end ? "" : (ep.hours ?? ""))}" placeholder="hrs" title="hours, if you don't know the times">
          <span class="sleephrs">${h ? h + " h" : ""}</span>
          <button class="btn sm ghost" data-sleep-rm="${i}" title="remove this stretch">&times;</button>
        </div>`;
    }).join("");
    const line = sum.count
      ? `${sum.total} h total in ${sum.count} stretch${sum.count === 1 ? "" : "es"}${sum.count > 1 ? ` · longest ${sum.longest} h` : ""}`
      : "nothing logged";
    return `
        <div class="rowitem sleepblock">
          <div class="sleephead"><span>Sleep (each stretch, in the 24 h ending this day)</span><span class="muted small">${line}</span></div>
          ${rows}
          <button class="btn sm" data-sleep-add>+ add a stretch</button>
        </div>`;
  }

  function onChange(e) {
    const d = getDay(current);
    if (e.target.matches("[data-acted]")) {
      const u = e.target.dataset.acted;
      d.urges[u] ||= { level: 0, acted: false };
      d.urges[u].acted = e.target.checked;
      save();
    }
    if (e.target.matches("[data-vuln]")) { d.vuln[e.target.dataset.vuln] = e.target.value; save(); }
    if (e.target.matches("[data-sleep]")) {
      const ep = d.sleep[Number(e.target.dataset.sleep)];
      if (ep) { ep[e.target.dataset.sf] = e.target.value; sleepSummary(d); save(); rerender(); }
    }
  }
  function onInput(e) {
    if (e.target.matches("[data-note]")) { getDay(current).note = e.target.value; save(); }
  }

  function rerender() {
    const root = document.getElementById("view");
    root.removeEventListener("click", onClick);
    root.removeEventListener("change", onChange);
    root.removeEventListener("input", onInput);
    root.removeEventListener("toggle", onToggle, true);
    render(root);
  }

  function historyHtml() {
    const days = [];
    for (let i = 13; i >= 0; i--) days.push(shiftDay(dayKey(), -i));
    const s = state.settings;
    const rows = [];
    const cell = (v, cls, extra = "") => {
      const alpha = v == null ? 0 : 0.15 + (v / 5) * 0.85;
      const col = cls === "urge" ? `rgba(214,60,143,${alpha})` : `rgba(155,92,255,${alpha})`;
      return `<span class="heat" style="background:${v == null ? "rgba(255,255,255,.04)" : col};${extra}">${v ?? ""}</span>`;
    };
    rows.push(`<div class="heatrow"><span class="lbl"></span>${days.map((k) => `<span class="heat muted" style="cursor:pointer" data-day="${k}" title="${fmtDate(k)}">${k.slice(-2)}</span>`).join("")}</div>`);
    for (const e of s.emotions) {
      rows.push(`<div class="heatrow"><span class="lbl">${esc(e)}</span>${days.map((k) => cell(state.diary[k]?.emotions?.[e] ?? null, "emo")).join("")}</div>`);
    }
    for (const u of s.urges) {
      rows.push(`<div class="heatrow"><span class="lbl" title="${esc(u)}">${esc(u.length > 16 ? u.slice(0, 15) + "…" : u)}</span>${days.map((k) => {
        const r = state.diary[k]?.urges?.[u];
        return cell(r ? r.level : null, "urge", r?.acted ? "outline:2px solid var(--pink)" : "");
      }).join("")}</div>`);
    }
    const filled = days.filter((k) => dayHasContent(state.diary[k])).length;
    rows.push(`<p class="small muted mt">${filled} of 14 days filled in. Purple = emotion strength, pink = urge strength, pink outline = acted on it. Click a day number to open it.</p>`);
    return rows.join("");
  }

  function noteToast() { toast("Saved"); }
  return { render, noteToast };
})();

/* ---- js/ui/drawer.js ---- */
const __m_js_ui_drawer_js = (() => {
  const { state, save, uid, fmtWhen } = __m_js_state_js;
  const { HOLD_OPTIONS, FACT_PROMPTS } = __m_js_data_skills_js;
  const { esc, toast, copyText, fmtCountdown, confirmBox } = __m_js_ui_dom_js;

  let tick = null;
  let holdMs = HOLD_OPTIONS[0].ms;

  function render(root) {
    root.innerHTML = `
    <p class="help">Write the message here instead of in the phone. It locks for the time you pick. When it unlocks you see it again next to a few questions, and only then decide: send it as is, edit it, or let it go. Nothing here ever sends anything.</p>
    <div class="grid two">
      <section class="card accent-pink drawer-compose">
        <h3>Put a message in the drawer</h3>
        <label class="field"><span>To (a name or label, optional)</span><input type="text" id="dr-to" placeholder="who it is for"></label>
        <label class="field"><span>The message, exactly as you want to send it right now</span><textarea id="dr-text" placeholder="Say everything. It is going in a drawer, not to them."></textarea></label>
        <div class="field"><span class="small muted">Hold for</span>
          <div class="holdopts">${HOLD_OPTIONS.map((o) => `<button class="chip pink ${o.ms === holdMs ? "on" : ""}" data-hold="${o.ms}">${o.label}</button>`).join("")}</div>
        </div>
        <button class="btn pink" id="dr-lock">Lock it in the drawer</button>
      </section>
      <section class="card accent-teal">
        <h3>What the drawer has done</h3>
        ${statsHtml()}
        <p class="small muted mt">"Let go" and "edited" are the wins. Every one of those is a message the calm version of you would not have sent as written.</p>
      </section>
    </div>
    <section class="mt">
      <h3>In the drawer</h3>
      <div class="list" id="dr-list">${listHtml()}</div>
    </section>`;

    root.addEventListener("click", onClick);
    root.addEventListener("input", onInput);
    clearInterval(tick);
    tick = setInterval(() => {
      const anyHeld = state.drawer.some((m) => m.status === "held");
      if (!anyHeld) return;
      const list = document.getElementById("dr-list");
      if (!list) { clearInterval(tick); return; }
      const now = Date.now();
      let changed = false;
      for (const m of state.drawer) if (m.status === "held" && m.unlockAt <= now) { m.status = "ready"; changed = true; }
      if (changed) { save(); list.innerHTML = listHtml(); toast("A message is ready to look at"); return; }
      list.querySelectorAll("[data-cd]").forEach((el) => { el.textContent = fmtCountdown(Number(el.dataset.cd) - now); });
    }, 1000);
  }

  function unmount() { clearInterval(tick); }

  function statsHtml() {
    const c = { held: 0, ready: 0, sent: 0, edited: 0, deleted: 0 };
    for (const m of state.drawer) c[m.status] = (c[m.status] || 0) + 1;
    const resolved = c.sent + c.edited + c.deleted;
    return `<div class="drawer-stats">
      <div class="stat"><div class="n">${c.held + c.ready}</div><div class="l">waiting</div></div>
      <div class="stat"><div class="n">${c.deleted}</div><div class="l">let go</div></div>
      <div class="stat"><div class="n">${c.edited}</div><div class="l">edited first</div></div>
      <div class="stat"><div class="n">${c.sent}</div><div class="l">sent as written</div></div>
    </div>
    ${resolved ? `<div class="bar mt"><i style="width:${Math.round(((c.deleted + c.edited) / resolved) * 100)}%"></i></div><div class="small muted">${Math.round(((c.deleted + c.edited) / resolved) * 100)}% of unlocked messages were changed or dropped</div>` : ""}`;
  }

  function listHtml() {
    const items = [...state.drawer].sort((a, b) => b.createdAt - a.createdAt);
    if (!items.length) return `<div class="empty">Empty. That is fine.</div>`;
    const now = Date.now();
    return items.map((m) => {
      if (m.status === "held") {
        return `<div class="item drawer-held" data-id="${m.id}">
          <div class="head"><span><span class="pill pink">locked</span> ${m.to ? "to " + esc(m.to) : ""}</span>
            <span class="countdown" data-cd="${m.unlockAt}">${fmtCountdown(m.unlockAt - now)}</span></div>
          <pre class="quote msg">${esc(m.text)}</pre>
          <div class="row between"><span class="when">put in ${fmtWhen(m.createdAt)} · opens ${fmtWhen(m.unlockAt)}</span>
            <button class="btn sm ghost" data-act="drop">let it go now</button></div>
        </div>`;
      }
      if (m.status === "ready") {
        return `<div class="item drawer-ready" data-id="${m.id}">
          <div class="head"><span><span class="pill teal">unlocked</span> ${m.to ? "to " + esc(m.to) : ""}</span><span class="when">written ${fmtWhen(m.createdAt)}</span></div>
          <pre class="quote">${esc(m.text)}</pre>
          <div class="facts">
            ${FACT_PROMPTS.map((p) => `<label class="field"><span>${p.q}</span><textarea data-fact="${p.key}" rows="2">${esc(m.facts?.[p.key] || "")}</textarea></label>`).join("")}
          </div>
          <label class="field"><span>Rewrite (optional). If you change it here and copy, it counts as "edited".</span><textarea data-rewrite rows="3">${esc(m.rewrite || "")}</textarea></label>
          <div class="row">
            <button class="btn teal" data-act="copy-edit">Copy the rewrite</button>
            <button class="btn" data-act="copy-orig">Copy the original</button>
            <button class="btn primary" data-act="drop">Let it go</button>
          </div>
        </div>`;
      }
      const pill = { sent: "pill", edited: "pill teal", deleted: "pill purple" }[m.status];
      const label = { sent: "sent as written", edited: "edited, then copied", deleted: "let go" }[m.status];
      return `<details class="item" data-id="${m.id}"><summary><span class="${pill}">${label}</span> ${m.to ? "to " + esc(m.to) : ""} <span class="when">· ${fmtWhen(m.resolvedAt || m.createdAt)}</span></summary>
        <pre class="quote">${esc(m.text)}</pre>${m.rewrite ? `<div class="small muted">Rewrite:</div><pre class="quote" style="border-color:var(--teal)">${esc(m.rewrite)}</pre>` : ""}
        <button class="btn sm danger" data-act="forget">remove from history</button></details>`;
    }).join("");
  }

  function onClick(e) {
    const hold = e.target.closest("[data-hold]");
    if (hold) { holdMs = Number(hold.dataset.hold); document.querySelectorAll("[data-hold]").forEach((b) => b.classList.toggle("on", Number(b.dataset.hold) === holdMs)); return; }
    if (e.target.id === "dr-lock") {
      const text = document.getElementById("dr-text").value.trim();
      if (!text) { toast("Write the message first"); return; }
      const now = Date.now();
      state.drawer.push({ id: uid(), to: document.getElementById("dr-to").value.trim(), text, createdAt: now, unlockAt: now + holdMs, status: "held", facts: {}, rewrite: "" });
      save();
      document.getElementById("dr-text").value = ""; document.getElementById("dr-to").value = "";
      document.getElementById("dr-list").innerHTML = listHtml();
      toast("Locked. It will still be here.");
      return;
    }
    const btn = e.target.closest("[data-act]");
    if (!btn) return;
    const item = btn.closest("[data-id]");
    const m = state.drawer.find((x) => x.id === item.dataset.id);
    if (!m) return;
    const act = btn.dataset.act;
    if (act === "drop") {
      if (m.status === "held" && !confirmBox("Let this one go without reading it again?")) return;
      captureFacts(item, m); m.status = "deleted"; m.resolvedAt = Date.now();
    } else if (act === "copy-orig") {
      captureFacts(item, m); copyText(m.text); m.status = "sent"; m.resolvedAt = Date.now();
    } else if (act === "copy-edit") {
      captureFacts(item, m);
      if (!m.rewrite.trim()) { toast("Write the rewrite first, or copy the original"); return; }
      copyText(m.rewrite); m.status = "edited"; m.resolvedAt = Date.now();
    } else if (act === "forget") {
      if (!confirmBox("Remove this from the drawer history?")) return;
      state.drawer = state.drawer.filter((x) => x.id !== m.id);
    }
    save();
    const root = document.getElementById("view");
    root.removeEventListener("click", onClick);
    root.removeEventListener("input", onInput);
    render(root);
  }

  function onInput(e) {
    const item = e.target.closest("[data-id]");
    if (!item || !(e.target.matches("[data-fact]") || e.target.matches("[data-rewrite]"))) return;
    const m = state.drawer.find((x) => x.id === item.dataset.id);
    if (m) { captureFacts(item, m); save(); }
  }

  function captureFacts(item, m) {
    m.facts = {};
    item.querySelectorAll("[data-fact]").forEach((t) => { m.facts[t.dataset.fact] = t.value; });
    const rw = item.querySelector("[data-rewrite]");
    if (rw) m.rewrite = rw.value;
  }
  return { render, unmount };
})();

const __m_js_ui_chain_js = (() => {
  const { state, save, uid, dayKey, fmtDate } = __m_js_state_js;
  const { LINK_KINDS } = __m_js_data_skills_js;

  let draft = null;

  function render(root) {
    root.innerHTML = `
    <p class="help">Chain analysis: after something blew up, walk it backward. Trigger, what made you vulnerable, then each link in order (a thought, a feeling, a body sensation, an action, something that happened), then what it cost, then where a skill could have gone in. It is a map, not a verdict.</p>

    root.addEventListener("input", onInput);
  }

  function newDraft() {

  }

  function formHtml(c) {
    return `
    <label class="field"><span>Date</span><input type="date" data-f="date" value="${c.date}"></label>
    <label class="field"><span>The behaviour (what you did that you want to understand)</span><textarea data-f="behavior" rows="2">${esc(c.behavior)}</textarea></label>
    <label class="field"><span>Prompting event (what set it off, just the facts)</span><textarea data-f="prompt" rows="2">${esc(c.prompt)}</textarea></label>
    <label class="field"><span>Vulnerabilities (sleep, hunger, pain, earlier conflict, substances)</span><textarea data-f="vuln" rows="2">${esc(c.vuln)}</textarea></label>
    <div class="field"><span class="small muted">Links, in order</span>
      <div class="links">${c.links.map((l, i) => `
        <div class="link" data-i="${i}">
          <select data-lk="${i}">${LINK_KINDS.map((k) => `<option ${l.kind === k ? "selected" : ""}>${k}</option>`).join("")}</select>
          <input type="text" data-lt="${i}" value="${esc(l.text)}" placeholder="then…">
          <button class="btn sm ghost" data-rm="${i}" title="remove">×</button>
        </div>`).join("")}</div>
      <button class="btn sm" data-addlink>+ add link</button>
    </div>
    <label class="field"><span>Consequences (for you, for others, short and long term)</span><textarea data-f="consequences" rows="2">${esc(c.consequences)}</textarea></label>
    <label class="field"><span>Where could a skill have gone in, and which one?</span><textarea data-f="skillPoint" rows="2">${esc(c.skillPoint)}</textarea></label>
    <label class="field"><span>Repair (what, if anything, you will do about the damage)</span><textarea data-f="repair" rows="2">${esc(c.repair)}</textarea></label>
    <div class="row"><button class="btn primary" data-save>Save chain</button>${draft && state.chains.some((x) => x.id === draft.id) ? '<button class="btn ghost" data-cancel>Cancel</button>' : ""}</div>`;
  }

  function viewHtml(c) {
    const step = (l, v) => v ? `<div class="step"><b>${l}</b><span>${esc(v)}</span></div>` : "";
    return `<details class="item chainview" data-id="${c.id}">
      <summary>${fmtDate(c.date)} · ${esc(c.behavior || "(no behaviour written)").slice(0, 80)}</summary>
      ${step("Prompting event", c.prompt)}${step("Vulnerabilities", c.vuln)}
      ${c.links.filter((l) => l.text).map((l) => `<div class="step"><b class="pill purple" style="justify-self:start">${l.kind}</b><span>${esc(l.text)}</span></div>`).join("")}
      ${step("Behaviour", c.behavior)}${step("Consequences", c.consequences)}${step("Skill point", c.skillPoint)}${step("Repair", c.repair)}
      <div class="row mt"><button class="btn sm" data-edit>Edit</button><button class="btn sm danger" data-del>Delete</button></div>
    </details>`;
  }

  function onInput(e) {
    const c = draft || newDraft();
    if (e.target.matches("[data-f]")) c[e.target.dataset.f] = e.target.value;
    if (e.target.matches("[data-lt]")) c.links[Number(e.target.dataset.lt)].text = e.target.value;
    if (e.target.matches("[data-lk]")) c.links[Number(e.target.dataset.lk)].kind = e.target.value;
  }

  function onClick(e) {
    const c = draft || newDraft();
    if (e.target.closest("[data-addlink]")) { c.links.push({ kind: "thought", text: "" }); refresh(); return; }
    const rm = e.target.closest("[data-rm]");
    if (rm) { c.links.splice(Number(rm.dataset.rm), 1); if (!c.links.length) c.links.push({ kind: "thought", text: "" }); refresh(); return; }
    if (e.target.closest("[data-save]")) {
      if (!c.behavior.trim() && !c.prompt.trim()) { toast("Write at least the behaviour or the trigger"); return; }
      const i = state.chains.findIndex((x) => x.id === c.id);

    const c = { sent: 0, edited: 0, deleted: 0, held: 0, ready: 0 };
    for (const m of dr) c[m.status]++;
    L.push(`Drawer: ${dr.length} messages held. Let go ${c.deleted}, edited ${c.edited}, sent as written ${c.sent}, still waiting ${c.held + c.ready}.`);
    const chains = state.chains.filter((x) => keys.includes(x.date));
    L.push(`Chain analyses: ${chains.length}` + (chains.length ? " -> " + chains.map((x) => `${fmtDate(x.date)}: ${x.behavior || x.prompt}`.slice(0, 70)).join("; ") : ""));
    const cr = state.crises.filter((x) => x.at >= since);
    if (cr.length) {
      const rated = cr.filter((x) => x.before != null && x.after != null);
      const drop = rated.length ? (rated.reduce((a, x) => a + (x.before - x.after), 0) / rated.length).toFixed(1) : "n/a";
      L.push(`Crisis mode used ${cr.length} times; average distress drop ${drop} points (0-10 scale).`);
    } else L.push("Crisis mode: not used.");
    const checks = state.coach.filter((x) => keys.includes(x.date));
    if (checks.length) L.push(`Emotion check-ins: ${checks.length} (${checks.filter((x) => !x.fits).length} opposite action, ${checks.filter((x) => x.fits).length} fit the facts).`);
    const sus = (state.suspicions || []).filter((x) => keys.includes(x.date));
    if (sus.length) { const closed = sus.filter((x) => x.outcome); L.push(`Suspicion checks: ${sus.length} logged, ${closed.length} closed, ${closed.filter((x) => x.outcome === "true").length} turned out true.`); }
    const preds = state.people.flatMap((p) => p.predictions.filter((x) => x.outcome && keys.includes(x.date)));
    if (preds.length) L.push(`Abandonment predictions checked: ${preds.length}, came true ${preds.filter((x) => x.outcome === "hit").length}.`);
    L.push("");
    const notes = filled.filter((k) => state.diary[k].note).map((k) => `  ${fmtDate(k)}: ${state.diary[k].note}`);
    if (notes.length) { L.push("Notes:"); L.push(...notes); }
    return L.join("\n");
  }
  return { render, summary };
})();

const __m_js_ui_settings_js = (() => {
  const { state, save, replaceState, resetState } = __m_js_state_js;
  const { backend } = __m_js_storage_js;
  const { DEFAULT_SETTINGS, DEFAULT_EMOTIONS, DEFAULT_URGES } = __m_js_data_skills_js;
  const { esc, toast, download, confirmBox } = __m_js_ui_dom_js;

          <button class="btn sm mt" data-addc>+ add person</button></section>
        <section class="card mb"><h3>Hotlines</h3>

          <button class="btn sm mt" data-addh>+ add hotline</button>
          <label class="field mt"><span>Emergency line shown at the bottom of crisis mode</span><input type="text" data-emergency value="${esc(s.emergency)}"></label></section>
        <section class="card mb"><h3>Backup</h3>
          <div class="row"><button class="btn" data-export>Export all data (.json)</button><label class="btn">Import .json<input type="file" accept=".json,application/json" data-import hidden></label></div>
          <div class="row mt"><button class="btn sm ghost" data-resetlists>Reset lists to defaults</button><button class="btn sm danger" data-wipe>Erase everything</button></div></section>
      </div>
    </div>`;
    root.addEventListener("input", onInput);
    root.addEventListener("change", onChange);
    root.addEventListener("click", onClick);

  function onInput(e) {
    const s = state.settings, t = e.target, i = Number(t.dataset.i);
    if (t.matches("[data-list]")) s[t.dataset.list][i] = t.value;
    if (t.matches("[data-c]")) s.contacts[i][t.dataset.c] = t.value;
    if (t.matches("[data-h]")) s.hotlines[i][t.dataset.h] = t.value;
    if (t.matches("[data-plan]")) s.plan = t.value;
    if (t.matches("[data-emergency]")) s.emergency = t.value;

  function onChange(e) {
    if (!e.target.matches("[data-import]")) return;
    const f = e.target.files[0]; if (!f) return;

      try {
        const obj = JSON.parse(txt);
        if (!obj || typeof obj !== "object" || !("diary" in obj)) throw new Error("not a Ballast file");
        if (!confirmBox("Replace everything in Ballast with this file?")) return;
        replaceState(obj); toast("Imported"); refresh();
      } catch (err) { toast("Could not import: " + err.message); }
    });
  }

  function onClick(e) {
    const s = state.settings;
    const t = e.target.closest("button"); if (!t) return;
    const i = Number(t.dataset.i);
    if (t.dataset.addl) { s[t.dataset.addl].push(""); save(); refresh(); return; }
    if (t.dataset.rml) { s[t.dataset.rml].splice(i, 1); save(); refresh(); return; }
    if (t.hasAttribute("data-addc")) { s.contacts.push({ name: "", number: "", note: "" }); save(); refresh(); return; }
    if (t.dataset.rmc != null) { s.contacts.splice(Number(t.dataset.rmc), 1); save(); refresh(); return; }
    if (t.hasAttribute("data-addh")) { s.hotlines.push({ name: "", number: "", note: "" }); save(); refresh(); return; }
    if (t.dataset.rmh != null) { s.hotlines.splice(Number(t.dataset.rmh), 1); save(); refresh(); return; }
    if (t.hasAttribute("data-export")) { download(`ballast-backup-${new Date().toISOString().slice(0, 10)}.json`, JSON.stringify(state, null, 2), "application/json"); return; }
    if (t.hasAttribute("data-resetlists")) {
      if (!confirmBox("Reset the emotion, urge, soothe and distraction lists to the defaults? Your diary entries are kept.")) return;
      Object.assign(s, structuredClone(DEFAULT_SETTINGS), { plan: s.plan, contacts: s.contacts, hotlines: s.hotlines, emergency: s.emergency, emotions: [...DEFAULT_EMOTIONS], urges: [...DEFAULT_URGES] });
      save(); refresh(); return;
    }
    if (t.hasAttribute("data-wipe")) {
      if (!confirmBox("Erase ALL Ballast data on this PC? Export a backup first if you might want it back.")) return;
      if (!confirmBox("Last chance. Erase everything?")) return;
      resetState(); toast("Erased"); refresh();
    }
  }
  return { render };
})();

/* ---- js/ui/crisis.js ---- */
const __m_js_ui_crisis_js = (() => {
  // Crisis overlay: five guided steps for right now. Opened from "I need help now".
  const { state, save, uid } = __m_js_state_js;
  const { esc } = __m_js_ui_dom_js;

  const STEPS = ["Rate", "Stop", "Body", "Your list", "Plan"];
  const TIPP = [
    { key: "temp", title: "Temperature", text: "Cold water on the face and hold your breath for 30 seconds, or hold ice in your hands. This trips the dive reflex and slows the heart.", secs: 30 },
    { key: "exercise", title: "Intense exercise", text: "60 seconds of anything that gets the heart up: jumping jacks, stairs, a fast walk. Burn the adrenaline instead of holding it.", secs: 60 },
    { key: "breath", title: "Paced breathing", text: "Use the breathing on the Stop step for 2 minutes. Out-breath longer than the in-breath.", secs: 0 },
    { key: "pmr", title: "Paired muscle relaxation", text: "Tense a muscle group on the in-breath, release on the out-breath. Work down the body: face, shoulders, hands, stomach, legs, feet.", secs: 60 },
  ];

  let session = null;
  let step = 0;
  let timers = [];   // every setTimeout/setInterval id we own
  let root = null;

  function open() {
    root = document.getElementById("crisis");
    session = { id: uid(), at: Date.now(), before: null, after: null, tried: [] };
    step = 0;
    root.classList.remove("hidden");
    root.addEventListener("click", onClick);
    document.addEventListener("keydown", onKey);
    render();
  }

  function close() {
    if (!root) return;
    stopTimers();
    if (session && (session.before !== null || session.after !== null || session.tried.length)) {
      if (!state.crises.some((c) => c.id === session.id)) { state.crises.push(session); save(); }
    }
    session = null;
    root.removeEventListener("click", onClick);
    document.removeEventListener("keydown", onKey);
    root.classList.add("hidden");
    root.innerHTML = "";
    document.getElementById("crisis-btn")?.focus();
  }

  function onKey(e) { if (e.key === "Escape") close(); }

  function stopTimers() {
    for (const t of timers) { clearTimeout(t); clearInterval(t); }
    timers = [];
  }

  // ---- rendering ----
  function render() {
    stopTimers();
    const body = [rateStep, stopStep, bodyStep, listStep, planStep][step]();
    root.innerHTML = `<div class="inner">
      <button class="btn sm ghost close" data-act="close" aria-label="Close">Close</button>
      <div class="steps" role="tablist">${STEPS.map((s, i) => `<button role="tab" aria-selected="${i === step}" class="${i === step ? "active" : ""}" data-step="${i}">${i + 1}. ${s}</button>`).join("")}</div>
      ${body}
      <div class="row mt">${step < STEPS.length - 1 ? `<button class="btn primary" data-act="next">Next</button>` : ""}</div>
    </div>`;
    root.querySelector(".inner > h1, .inner > .steps button.active")?.focus();
  }

  function rateRow(which) {
    const v = session[which];
    return `<div class="rate" data-rate="${which}">${Array.from({ length: 11 }, (_, i) => `<button type="button" data-v="${i}" class="${v === i ? "on" : ""}" aria-pressed="${v === i}">${i}</button>`).join("")}</div>`;
  }

  function rateStep() {
    return `<h1>How bad is it right now, 0 to 10?</h1>
    <p class="lead">${rateRow("before")}</p>
    <p class="muted">No wrong answer. This just lets you see later whether the next few minutes helped.</p>`;
  }

  function stopStep() {
    return `<h1>STOP</h1>
    <div class="acro">
      <div><b>S</b><div class="big"><strong>Stop.</strong> Freeze. Do not move a muscle. Do not send. Do not speak.</div></div>
      <div><b>T</b><div class="big"><strong>Take a step back.</strong> Leave the room, or put the phone in another room.</div></div>
      <div><b>O</b><div class="big"><strong>Observe.</strong> What is happening inside and outside. Just notice.</div></div>
      <div><b>P</b><div class="big"><strong>Proceed mindfully.</strong> What do you want the next hour to look like?</div></div>
    </div>
    <div class="card mt">
      <div class="breath" id="breath"><div class="ring"></div><div class="word">Ready</div><div class="t">90 s</div></div>
      <div class="row"><button class="btn teal" data-act="breath">Start breathing</button><span class="muted small">In for 4, out for 6, for 90 seconds.</span></div>
    </div>`;
  }

  function bodyStep() {
    return `<h1>Change the body first</h1>
    <p class="muted">TIPP. Pick one. Each one lowers arousal fast without deciding anything.</p>
    <div class="tipp">${TIPP.map((c) => `<div class="card">
        <b>${c.title}</b>
        <p class="big">${c.text}</p>
        ${c.secs ? `<button class="btn sm timerbtn" data-timer="${c.key}" data-secs="${c.secs}">${c.secs} s timer<span class="countdown"></span></button>` : `<button class="btn sm ghost" data-step="1">Go to Stop step</button>`}
      </div>`).join("")}</div>`;
  }

  function listStep() {
    const { soothe = [], distract = [] } = state.settings;
    if (!soothe.length && !distract.length) {
      return `<h1>Your list</h1><p class="lead">Nothing here yet. Settings lets you fill in soothe and distract lists while you are calm.</p>`;
    }
    const list = (title, items, kind) => items.length ? `<h3>${title}</h3><ul class="plainlist">${items.map((t, i) => {
      const done = session.tried.includes(t);
      return `<li class="${done ? "done" : ""}"><input type="checkbox" id="tr-${kind}-${i}" data-tried="${esc(t)}" ${done ? "checked" : ""}><label for="tr-${kind}-${i}">${esc(t)}</label></li>`;
    }).join("")}</ul>` : "";
    return `<h1>Your list</h1>
    ${list("Soothe", soothe, "s")}
    ${list("Distract", distract, "d")}
    <p class="lead mt">Pick one. Do it for 15 minutes before deciding anything.</p>`;
  }

  function planStep() {
    const s = state.settings;
    const person = (p) => `<div class="item"><b>${esc(p.name)}</b><div class="num">${esc(p.number)}</div>${p.note ? `<div class="muted small">${esc(p.note)}</div>` : ""}</div>`;
    return `<h1>Your plan</h1>
    ${s.plan ? `<pre class="quote">${esc(s.plan)}</pre>` : `<p class="muted">No plan written yet. Settings lets you write one while calm.</p>`}
    ${(s.contacts || []).length ? `<h3 class="mt">People</h3><div class="list contacts">${s.contacts.map(person).join("")}</div>` : ""}
    ${(s.hotlines || []).length ? `<h3 class="mt">Lines</h3><div class="list contacts">${s.hotlines.map(person).join("")}</div>` : ""}
    ${s.emergency ? `<p class="mt"><span class="pill danger">${esc(s.emergency)}</span></p>` : ""}
    <h3 class="mt">How bad is it now, 0 to 10?</h3>
    ${rateRow("after")}
    ${session.before !== null && session.after !== null ? `<p class="muted small">Before: ${session.before}. Now: ${session.after}.</p>` : ""}
    <div class="row mt"><button class="btn teal" data-act="done">Done</button></div>`;
  }

  // ---- events ----
  function onClick(e) {
    const t = e.target;
    const act = t.closest("[data-act]")?.dataset.act;
    if (act === "close" || act === "done") { close(); return; }
    if (act === "next") { step = Math.min(step + 1, STEPS.length - 1); render(); return; }
    if (act === "breath") { toggleBreath(t.closest("[data-act]")); return; }
    const tab = t.closest("[data-step]");
    if (tab) { step = Number(tab.dataset.step); render(); return; }
    const rateBtn = t.closest(".rate button");
    if (rateBtn) {
      const which = rateBtn.closest("[data-rate]").dataset.rate;
      session[which] = Number(rateBtn.dataset.v);
      rateBtn.parentElement.querySelectorAll("button").forEach((b) => { const on = b === rateBtn; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
      return;
    }
    if (t.matches("[data-tried]")) {
      const text = t.dataset.tried;
      if (t.checked && !session.tried.includes(text)) session.tried.push(text);
      if (!t.checked) session.tried = session.tried.filter((x) => x !== text);
      t.closest("li").classList.toggle("done", t.checked);
      return;
    }
    const timerBtn = t.closest("[data-timer]");
    if (timerBtn) startTimer(timerBtn);
  }

  // ---- breathing (4 s in, 6 s out, 90 s total) ----
  function toggleBreath(btn) {
    const box = document.getElementById("breath");
    if (btn.dataset.running) { stopTimers(); btn.textContent = "Start breathing"; delete btn.dataset.running; box.className = "breath"; box.querySelector(".word").textContent = "Ready"; return; }
    btn.dataset.running = "1"; btn.textContent = "Stop";
    const word = box.querySelector(".word"), tEl = box.querySelector(".t");
    const end = Date.now() + 90e3;
    let phaseIn = false;
    const phase = () => {
      if (Date.now() >= end) { stopTimers(); box.className = "breath"; word.textContent = "Done"; tEl.textContent = "90 s"; btn.textContent = "Start breathing"; delete btn.dataset.running; return; }
      phaseIn = !phaseIn;
      box.className = "breath " + (phaseIn ? "in" : "out");
      word.textContent = phaseIn ? "Breathe in" : "Breathe out";
      timers.push(setTimeout(phase, phaseIn ? 4000 : 6000));
    };
    phase();
    timers.push(setInterval(() => { tEl.textContent = Math.max(0, Math.ceil((end - Date.now()) / 1000)) + " s"; }, 250));
  }

  // ---- TIPP timers (one at a time) ----
  function startTimer(btn) {
    stopTimers();
    root.querySelectorAll("[data-timer] .countdown").forEach((c) => { c.textContent = ""; });
    const cd = btn.querySelector(".countdown");
    const end = Date.now() + Number(btn.dataset.secs) * 1000;
    const tick = () => {
      const left = Math.ceil((end - Date.now()) / 1000);
      if (left <= 0) { cd.textContent = "done"; stopTimers(); return; }
      cd.textContent = left + " s";
    };
    tick();
    timers.push(setInterval(tick, 250));
  }
  return { open, close };
})();

const __m_js_main_js = (() => {
  const { init, state, save } = __m_js_state_js;
  const { register, go } = __m_js_router_js;
  const today = __m_js_ui_today_js;
  const drawer = __m_js_ui_drawer_js;
  const chain = __m_js_ui_chain_js;
  const people = __m_js_ui_people_js;
  const coach = __m_js_ui_coach_js;
  const suspicion = __m_js_ui_suspicion_js;
  const review = __m_js_ui_review_js;
  const settings = __m_js_ui_settings_js;
  const crisis = __m_js_ui_crisis_js;
  const { toast } = __m_js_ui_dom_js;

  register("today", today);
  register("drawer", drawer);
  register("chain", chain);
  register("people", people);
  register("coach", coach);
  register("suspicion", suspicion);
  register("review", review);
  register("settings", settings);

  async function start() {
    await init();
    // Promote any held drawer messages whose time has passed while the app was closed.
    const now = Date.now();
    let ready = 0;
    for (const m of state.drawer) if (m.status === "held" && m.unlockAt <= now) { m.status = "ready"; ready++; }
    if (ready) save();

    document.getElementById("tabs").addEventListener("click", (e) => {
      const b = e.target.closest("button[data-tab]");
      if (b) go(b.dataset.tab);
    });
    document.getElementById("crisis-btn").addEventListener("click", () => crisis.open());
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") crisis.close();
    });

    const hash = location.hash.replace("#", "");
    go(["today", "drawer", "chain", "people", "coach", "suspicion", "review", "settings"].includes(hash) ? hash : "today");
    if (ready) toast(ready === 1 ? "A drawer message is ready to look at" : `${ready} drawer messages are ready to look at`);
  }

  start();

  // Test hook for driving the app from the console or the build check.
  window.BL = { state, save, go, crisis };
  return {  };
})();
